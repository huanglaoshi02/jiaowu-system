<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教务管理系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; color: #333; font-size: 15px; line-height: 1.5;
}
input, select, textarea, button { font-family: inherit; font-size: 15px; }
button { cursor: pointer; }

/* ===== 登录页 ===== */
#login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg,#2b6de8,#1e4fb0); padding: 20px; }
.login-box { background: #fff; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.2); text-align: center; }
.login-box h1 { font-size: 22px; color: #1e4fb0; margin-bottom: 6px; }
.login-box p { color: #777; font-size: 14px; margin-bottom: 16px; }
.login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; outline: none; }
.login-box input:focus { border-color: #2b6de8; }
.login-box button { width: 100%; padding: 12px; background: #2b6de8; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; }
.login-box button:active { background: #1e4fb0; }

/* ===== 主框架 ===== */
#app-view { min-height: 100vh; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: 52px; background: #2b6de8; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.app-title { font-size: 18px; font-weight: 600; }
.logout-btn { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; }

/* 左侧菜单栏 */
.sidebar { position: fixed; top: 52px; left: 0; bottom: 0; z-index: 40; width: 190px; background: #fff; border-right: 1px solid #e5e7eb; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: none; border: none; color: #555; font-size: 14px; width: 100%; text-align: left; }
.nav-btn .ico { font-size: 20px; }
.nav-btn.active { background: #e8f0fe; color: #2b6de8; font-weight: 600; }
main { margin-left: 190px; padding: 66px 16px 24px; max-width: 860px; }
@media (max-width: 600px) {
  header { height: 48px; }
  .sidebar { top: 48px; width: 62px; padding: 10px 6px; }
  .nav-btn { justify-content: center; padding: 15px 0; }
  .nav-btn .txt { display: none; }
  main { margin-left: 62px; padding: 60px 10px 20px; }
}

/* ===== 卡片与通用 ===== */
.card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card h3 { font-size: 15px; margin-bottom: 10px; color: #333; display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 16px; font-weight: 600; margin: 16px 0 10px; }
.btn { display: inline-block; padding: 9px 14px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; }
.btn-primary { background: #2b6de8; color: #fff; }
.btn-primary:active { background: #1e4fb0; }
.btn-danger { background: #fdecec; color: #d64545; }
.btn-gray { background: #f0f2f5; color: #555; }
.btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
.btn-block { width: 100%; }
input[type="text"], input[type="password"], input[type="date"], input[type="number"], input[type="tel"], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 9px; outline: none; background: #fff;
}
input:focus, select:focus, textarea:focus { border-color: #2b6de8; }
.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-blue { background: #e8f0fe; color: #2b6de8; }
.badge-green { background: #e6f7ee; color: #1d9d5a; }
.badge-red { background: #fdecec; color: #d64545; }
.badge-orange { background: #fff3e0; color: #e07b00; }
.badge-gray { background: #f0f2f5; color: #777; }
.badge-purple { background: #f3edfd; color: #7a4de8; }
.empty { text-align: center; color: #999; padding: 26px 10px; font-size: 14px; }
.muted { color: #999; font-size: 12px; }

/* 统计卡 */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.stat-num { font-size: 26px; font-weight: 700; color: #2b6de8; }
.stat-label { font-size: 12px; color: #777; margin-top: 2px; }

/* 列表行 */
.list-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.list-item:last-child { border-bottom: none; }
.list-main { flex: 1; min-width: 0; }
.list-title { font-size: 15px; font-weight: 600; }
.list-sub { font-size: 12px; color: #888; margin-top: 2px; }

/* 弹窗 */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal-box { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; padding: 18px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-head span { font-size: 17px; font-weight: 700; }
.modal-head button { background: none; border: none; font-size: 18px; color: #999; }

/* 签到状态按钮 */
.sign-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.sign-btn { padding: 5px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: #fff; color: #555; }
.sign-btn.active { background: #2b6de8; border-color: #2b6de8; color: #fff; font-weight: 600; }
.sign-btn[data-s="late"].active { background: #e07b00; border-color: #e07b00; }
.sign-btn[data-s="leave"].active { background: #1d9d5a; border-color: #1d9d5a; }
.sign-btn[data-s="absent"].active { background: #d64545; border-color: #d64545; }

/* 计划 */
.plan-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.plan-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ccc; background: none; flex-shrink: 0; font-size: 14px; color: #fff; }
.plan-check.done { background: #1d9d5a; border-color: #1d9d5a; }
.plan-title { flex: 1; font-size: 14px; }
.plan-title.over { color: #d64545; }
.plan-title.finished { text-decoration: line-through; color: #aaa; }

/* 课程分组标题 */
.day-group { font-size: 13px; font-weight: 700; color: #2b6de8; margin: 14px 0 6px; }
.course-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.course-time { background: #e8f0fe; color: #2b6de8; border-radius: 8px; padding: 6px 8px; font-size: 13px; font-weight: 700; min-width: 92px; text-align: center; }
.course-info { flex: 1; min-width: 0; }

/* 折线图容器 */
.chart-box { margin-top: 8px; }
.chart-box canvas { width: 100%; height: 190px; display: block; }
.chart-title { font-size: 14px; font-weight: 600; color: #555; margin: 12px 0 4px; }

/* 签到记录行 */
.att-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
.tab-bar { display: flex; gap: 8px; margin-bottom: 10px; }
.tab { padding: 7px 12px; border-radius: 20px; background: #f0f2f5; border: none; font-size: 13px; color: #666; }
.tab.active { background: #2b6de8; color: #fff; font-weight: 600; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.toolbar input[type="date"] { flex: 1; }
.toolbar .btn { flex-shrink: 0; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="login-view">
  <div class="login-box">
    <h1>🏫 教务管理系统</h1>
    <div id="login-set">
      <p>首次使用，请设置你的管理密码：</p>
      <input id="set-pwd1" type="password" placeholder="设置密码（至少 4 位）" autocomplete="new-password">
      <input id="set-pwd2" type="password" placeholder="再次输入密码" autocomplete="new-password">
      <button onclick="setPassword()">设置并进入系统</button>
    </div>
    <div id="login-enter" style="display:none">
      <p>请输入管理密码：</p>
      <input id="login-pwd" type="password" placeholder="管理密码" autocomplete="current-password">
      <button onclick="doLogin()">进入系统</button>
    </div>
    <p style="margin-top:14px" class="muted">数据加密存储在云端，仅你本人可管理</p>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app-view" style="display:none">
  <header>
    <div class="app-title">🏫 教务工作台</div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </header>

  <!-- 左侧菜单栏 -->
  <nav class="sidebar">
    <button class="nav-btn active" data-page="home" onclick="showPage('home')"><span class="ico">🏠</span><span class="txt">首页</span></button>
    <button class="nav-btn" data-page="students" onclick="showPage('students')"><span class="ico">👦</span><span class="txt">学生档案</span></button>
    <button class="nav-btn" data-page="courses" onclick="showPage('courses')"><span class="ico">📅</span><span class="txt">排课管理</span></button>
    <button class="nav-btn" data-page="attendance" onclick="showPage('attendance')"><span class="ico">✅</span><span class="txt">签到管理</span></button>
    <button class="nav-btn" data-page="plans" onclick="showPage('plans')"><span class="ico">📝</span><span class="txt">工作计划</span></button>
  </nav>

  <main>
    <!-- 首页 -->
    <section id="page-home" class="page">
      <div id="home-stats" class="stats-grid"></div>
      <div class="card">
        <h3>📅 今日课程 <span id="home-today" class="muted"></span></h3>
        <div id="home-today-courses"></div>
      </div>
      <div class="card">
        <h3>⚠️ 课时不足提醒 <span class="muted">剩余 ≤ 2 节</span></h3>
        <div id="home-low-lessons"></div>
      </div>
      <div class="card">
        <h3>📝 待办事项</h3>
        <div id="home-plans"></div>
      </div>
    </section>

    <!-- 学生档案 -->
    <section id="page-students" class="page" style="display:none">
      <div class="toolbar">
        <input id="stu-search" type="text" placeholder="搜索姓名 / 科目…" oninput="renderStudents()">
        <button class="btn btn-primary" onclick="openStudentForm()">＋ 建档</button>
      </div>
      <div id="stu-list"></div>
    </section>

    <!-- 排课 -->
    <section id="page-courses" class="page" style="display:none">
      <div class="toolbar">
        <button class="btn btn-primary" style="flex:1" onclick="openCourseForm()">＋ 添加课程</button>
        <button class="btn btn-gray" onclick="exportCoursesCSV()">⬇ 导出课表</button>
      </div>
      <div class="tab-bar" style="margin-top:12px">
        <button class="tab active" id="tab-future" onclick="setCourseFilter('future')">未来课程</button>
        <button class="tab" id="tab-all" onclick="setCourseFilter('all')">全部课程</button>
      </div>
      <div id="course-list"></div>
    </section>

    <!-- 签到 -->
    <section id="page-attendance" class="page" style="display:none">
      <div class="toolbar">
        <input type="date" id="att-date" value="" onchange="renderAttendance()">
        <button class="btn btn-gray" onclick="exportAttendanceCSV()">⬇ 导出签到记录</button>
      </div>
      <div class="section-title" style="margin-top:0">✅ 当天上课 · 点击签到</div>
      <div id="att-list"></div>
      <div class="section-title">📋 当天签到记录</div>
      <div id="att-records"></div>
      <div class="section-title">🗂 历史签到记录</div>
      <div id="att-history"></div>
    </section>

    <!-- 工作计划 -->
    <section id="page-plans" class="page" style="display:none">
      <button class="btn btn-primary btn-block" onclick="openPlanForm()">＋ 添加工作计划</button>
      <div class="section-title">⏳ 待完成</div>
      <div class="card"><div id="plan-pending"></div></div>
      <div class="section-title">✅ 已完成</div>
      <div class="card"><div id="plan-done"></div></div>
    </section>
  </main>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title"></span><button onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
